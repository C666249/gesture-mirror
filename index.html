<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<title>幻境相机 · 手势动漫滤镜</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#05070e;
    --cy:#6fe9ff;
    --pk:#ff9dc8;
    --vi:#a58bff;
    --txt:rgba(240,246,255,.94);
    --dim:rgba(200,214,236,.55);
    --glass:rgba(10,16,28,.42);
    --line:rgba(150,200,255,.16);
    --f:"-apple-system",BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  html,body{height:100%;overflow:hidden;background:#04060c;font-family:var(--f);color:var(--txt);
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{position:fixed;inset:0}

  #gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
  #gl{z-index:1}
  #fx{z-index:2;pointer-events:none}
  #cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px}

  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-right,0px) + 20px)
            calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 20px)}
  #hud > *{pointer-events:auto}

  /* ---------- 品牌 ---------- */
  #brand{position:absolute;top:18px;left:20px;display:flex;align-items:center;gap:10px;
    opacity:0;transform:translateY(-6px);transition:.8s cubic-bezier(.2,.8,.2,1)}
  #brand.on{opacity:1;transform:none}
  #brand .mark{width:26px;height:26px;border-radius:8px;position:relative;
    background:linear-gradient(140deg,rgba(111,233,255,.85),rgba(255,157,200,.8));
    box-shadow:0 0 18px rgba(111,233,255,.45),inset 0 0 10px rgba(255,255,255,.35);
    display:grid;place-items:center}
  #brand .mark::after{content:"";width:9px;height:9px;border-radius:50%;background:#04060c;
    box-shadow:0 0 0 2px rgba(255,255,255,.55) inset}
  #brand .tx b{display:block;font-size:13.5px;letter-spacing:.16em;font-weight:650}
  #brand .tx span{display:block;font-size:9px;letter-spacing:.30em;color:var(--dim);margin-top:2px;
    font-weight:500;text-transform:uppercase}

  /* ---------- 状态 ---------- */
  #stat{position:absolute;top:20px;right:20px;display:flex;flex-direction:column;gap:7px;
    padding:11px 13px;border-radius:13px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    opacity:0;transform:translateY(-6px);transition:.8s .1s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 10px 40px rgba(0,0,0,.35)}
  #stat.on{opacity:1;transform:none}
  .row{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.06em;white-space:nowrap}
  .row i{width:6px;height:6px;border-radius:50%;background:#3a4760;flex:none;transition:.35s}
  .row span{color:var(--dim);min-width:44px}
  .row em{font-style:normal;color:rgba(228,238,252,.85);font-weight:550}
  .row[data-s="wait"] i{background:#f2c14e;box-shadow:0 0 8px rgba(242,193,78,.85);animation:bp 1.1s infinite}
  .row[data-s="ok"]   i{background:#4be08a;box-shadow:0 0 8px rgba(75,224,138,.9)}
  .row[data-s="bad"]  i{background:#ff5f6d;box-shadow:0 0 8px rgba(255,95,109,.9)}
  .row[data-s="act"]  i{background:var(--cy);box-shadow:0 0 10px rgba(111,233,255,1);animation:bp .7s infinite}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.32}}

  /* ---------- 提示 ---------- */
  #hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
    transform:translate(-50%,8px);font-size:11.5px;letter-spacing:.14em;color:rgba(215,230,250,.62);
    padding:7px 16px;border-radius:100px;background:rgba(8,12,22,.44);border:1px solid rgba(150,200,255,.10);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;transition:.6s;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
  #hint.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 底栏 ---------- */
  #bar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:7px;border-radius:100px;
    background:rgba(9,14,24,.52);border:1px solid rgba(150,200,255,.14);
    backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 14px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
    opacity:0;transform:translate(-50%,10px);transition:.8s .2s cubic-bezier(.2,.8,.2,1)}
  #bar.on{opacity:1;transform:translate(-50%,0)}
  #bar button{position:relative;border:0;cursor:pointer;font-family:var(--f);font-size:13px;font-weight:600;
    letter-spacing:.02em;color:rgba(228,238,252,.88);background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);border-radius:100px;padding:9px 17px;min-width:44px;
    transition:.22s cubic-bezier(.2,.8,.2,1);-webkit-user-select:none;user-select:none}
  #bar button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
  #bar button:active{transform:scale(.94)}
  #bar button.on{background:linear-gradient(140deg,rgba(111,233,255,.28),rgba(255,157,200,.24));
    border-color:rgba(160,225,255,.5);color:#fff;box-shadow:0 0 18px rgba(111,233,255,.35),inset 0 0 12px rgba(255,255,255,.12)}
  #bar button.primary{padding:9px 20px;
    background:linear-gradient(140deg,rgba(111,233,255,.9),rgba(140,180,255,.85)) ;color:#04121a;font-weight:700;
    border-color:transparent;box-shadow:0 4px 22px rgba(111,233,255,.35)}
  #bar button.primary.live{background:linear-gradient(140deg,rgba(255,120,150,.92),rgba(255,170,120,.9));
    color:#20060c;box-shadow:0 4px 22px rgba(255,120,150,.4)}
  #bar .sep{width:1px;height:18px;background:rgba(255,255,255,.10);margin:0 1px;flex:none}

  /* ---------- 自视窗 ---------- */
  #prevwrap{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    width:168px;height:126px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(150,200,255,.22);background:rgba(6,10,18,.6);
    box-shadow:0 12px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04);
    opacity:0;transform:translateY(8px);transition:.8s .28s cubic-bezier(.2,.8,.2,1)}
  #prevwrap.on{opacity:1;transform:none}
  #prev{width:100%;height:100%;display:block}
  #prevwrap .cap{position:absolute;left:7px;top:6px;font-size:8px;letter-spacing:.22em;
    color:rgba(200,225,255,.6);text-transform:uppercase;text-shadow:0 1px 3px #000}
  #prevwrap .off{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;
    letter-spacing:.16em;color:rgba(190,210,236,.4)}

  /* ---------- toast ---------- */
  #toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 22px);transform:translate(-50%,-8px);
    max-width:76vw;padding:10px 18px;border-radius:11px;font-size:11.5px;line-height:1.6;letter-spacing:.04em;
    background:rgba(30,12,18,.80);border:1px solid rgba(255,110,130,.34);color:#ffd9df;
    box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;transition:.45s;pointer-events:none;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast.good{background:rgba(10,26,24,.82);border-color:rgba(75,224,138,.34);color:#cdffe6}

  /* ---------- 礼物条（直播间感） ---------- */
  #gifts{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 164px);
    display:flex;flex-direction:column-reverse;gap:7px;align-items:flex-end;pointer-events:none}
  .gift{display:flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:100px;
    background:linear-gradient(100deg,rgba(255,157,200,.20),rgba(111,233,255,.16));
    border:1px solid rgba(255,180,214,.32);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    font-size:11px;letter-spacing:.10em;color:#fff;white-space:nowrap;
    box-shadow:0 8px 30px rgba(255,120,180,.22);
    animation:giftIn 2.8s cubic-bezier(.2,.8,.2,1) forwards}
  .gift b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
    background:linear-gradient(140deg,#8fe9ff,#ffa8d0);color:#1a0a14;font-size:11px;font-weight:800}
  .gift span{font-weight:600}
  .gift em{font-style:normal;color:rgba(255,255,255,.62);font-size:10px}
  @keyframes giftIn{
    0%{opacity:0;transform:translateX(26px) scale(.9)}
    12%{opacity:1;transform:translateX(0) scale(1)}
    78%{opacity:1;transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(-16px) scale(.96)}
  }

  /* ---------- 首屏 ---------- */
  #intro{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 50% 42%,rgba(12,20,38,.62),rgba(3,5,11,.95) 72%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    transition:opacity .8s ease,visibility .8s}
  #intro.gone{opacity:0;visibility:hidden;pointer-events:none}
  .card{width:min(430px,92vw);padding:30px 28px 24px;border-radius:22px;text-align:center;
    background:linear-gradient(170deg,rgba(16,24,42,.80),rgba(8,12,22,.92));
    border:1px solid rgba(150,200,255,.16);
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);
    animation:cardIn .9s cubic-bezier(.2,.8,.2,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .card .k{font-size:9px;letter-spacing:.42em;color:rgba(140,220,255,.62);text-transform:uppercase;margin-bottom:12px}
  .card h1{font-size:29px;font-weight:700;letter-spacing:.10em;
    background:linear-gradient(100deg,#ffffff,#a8e6ff 40%,#ffb3d6 78%);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
  .card p{font-size:12.5px;line-height:1.95;color:rgba(210,224,246,.72);letter-spacing:.04em;margin-bottom:22px}
  .card p b{color:#a8e6ff;font-weight:600}
  .acts{display:flex;gap:9px;margin-bottom:18px}
  .acts button{flex:1;border:0;cursor:pointer;font-family:var(--f);font-size:13px;font-weight:650;
    letter-spacing:.08em;padding:13px 10px;border-radius:12px;transition:.25s}
  #go{background:linear-gradient(120deg,#8fe9ff,#b3a4ff 60%,#ffb0d4);color:#071019;
    box-shadow:0 8px 28px rgba(143,233,255,.28)}
  #go:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(143,233,255,.38)}
  #demo{background:rgba(255,255,255,.06);color:rgba(220,232,250,.82);border:1px solid rgba(255,255,255,.10)}
  #demo:hover{background:rgba(255,255,255,.12)}
  .tips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;list-style:none;margin-bottom:16px}
  .tips li{padding:9px 4px;border-radius:10px;background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.055);font-size:10px;letter-spacing:.06em;color:rgba(200,216,240,.7)}
  .tips li b{display:block;font-size:15px;font-weight:700;color:#bfe9ff;margin-bottom:4px;letter-spacing:0}
  .err{min-height:0;font-size:10.5px;line-height:1.7;color:#ffb4bd;letter-spacing:.02em}
  .note{font-size:9px;letter-spacing:.2em;color:rgba(170,190,215,.34);margin-top:12px;text-transform:uppercase}

  @media (max-width:700px){
    #brand{top:14px;left:14px}
    #brand .tx b{font-size:12px}
    #stat{top:14px;right:14px;padding:9px 10px;gap:5px}
    .row{font-size:9.5px}
    .row span{min-width:38px}
    #bar{gap:6px;padding:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
    #bar button{padding:8px 13px;font-size:12px;min-width:38px}
    #bar button.primary{padding:8px 15px}
    #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 82px);font-size:10.5px;letter-spacing:.08em}
    #prevwrap{width:104px;height:80px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);border-radius:11px}
    #gifts{right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
    .gift{font-size:10px;padding:6px 10px 6px 7px}
    .card{padding:26px 20px 20px}
    .card h1{font-size:24px}
    .tips{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-height:460px){
    #hint{display:none}
    #prevwrap{width:88px;height:66px}
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="hud">
  <div id="brand">
    <div class="mark"></div>
    <div class="tx"><b>幻境相机</b><span>gesture mirror</span></div>
  </div>

  <div id="stat">
    <div class="row" id="rowCam" data-s="off"><i></i><span>摄像头</span><em>未开启</em></div>
    <div class="row" id="rowEng" data-s="off"><i></i><span>手势</span><em>待命</em></div>
    <div class="row" id="rowGes" data-s="off"><i></i><span>识别</span><em>—</em></div>
  </div>

  <div id="hint"></div>

  <div id="bar">
    <button class="primary" data-act="cam">开启摄像头</button>
    <div class="sep"></div>
    <button data-act="1">1</button>
    <button data-act="2">2</button>
    <button data-act="3">3</button>
    <button data-act="0">✕</button>
  </div>

  <div id="gifts"></div>

  <div id="prevwrap">
    <canvas id="prev"></canvas>
    <div class="cap">self</div>
    <div class="off" id="prevOff">no signal</div>
  </div>
</div>

<div id="toast"></div>

<div id="intro">
  <div class="card">
    <div class="k">gesture mirror</div>
    <h1>幻境相机</h1>
    <p>镜头照见真实，手势开出另一个世界。<br>
       拇指与食指拉开 — 框住的那一块会变成<b>动漫</b>。</p>
    <div class="acts">
      <button id="go">开启摄像头</button>
      <button id="demo">先看演示</button>
    </div>
    <ul class="tips">
      <li><b>1</b>雨夜</li>
      <li><b>2</b>樱吹雪</li>
      <li><b>3</b>萤火</li>
      <li><b>✊</b>收</li>
    </ul>
    <div class="err" id="errBox"></div>
    <p class="note">画面只在本机处理 · 不会上传</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     0. 基础
     ===================================================================== */
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var rand = function (a, b) { return a + Math.random() * (b - a); };

  var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var DPR = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.35 : 1.6);

  var glCvs = $('gl'), fxCvs = $('fx'), video = $('cam');
  var introEl = $('intro'), brandEl = $('brand'), statEl = $('stat'), barEl = $('bar');
  var hintEl = $('hint'), toastEl = $('toast'), giftsEl = $('gifts'), errBox = $('errBox');
  var rowCam = $('rowCam'), rowEng = $('rowEng'), rowGes = $('rowGes');
  var prevWrap = $('prevwrap'), prevCvs = $('prev'), prevOff = $('prevOff');

  var state = {
    mode: 'none',       // none | rain | sakura | firefly
    camOn: false,
    frame: { x0: 0.34, y0: 0.30, x1: 0.66, y1: 0.70, a: 0 },
    tgt: { x0: 0.34, y0: 0.30, x1: 0.66, y1: 0.70 },
    targetA: 0,
    hasVideo: false,
    useAlt: false,
    alt: null,
    srcW: 640,
    srcH: 480,
    gesture: '',
    flash: 0,
    burstAt: 0
  };

  var HINTS = {
    idle: '拇指 + 食指拉开，框住的地方会变成动漫',
    rain: '手势 1 · 雨夜',
    sakura: '手势 2 · 樱吹雪',
    firefly: '手势 3 · 萤火',
    frame: '取景中 · 框内是另一个世界',
    none: '手势 0 · 特效已关闭'
  };

  var hintTimer = 0;
  function setHint(text, hold) {
    hintEl.textContent = text;
    hintEl.classList.add('on');
    clearTimeout(hintTimer);
    if (hold !== 0) {
      hintTimer = setTimeout(function () { hintEl.classList.remove('on'); }, hold || 4200);
    }
  }

  var toastTimer = 0;
  function toast(msg, good) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('good', !!good);
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 6500);
  }

  function setRow(el, s, text) {
    el.setAttribute('data-s', s);
    el.querySelector('em').textContent = text;
  }

  function gift(icon, name, note) {
    var d = document.createElement('div');
    d.className = 'gift';
    d.innerHTML = '<b>' + icon + '</b><span>' + name + '</span><em>' + (note || '') + '</em>';
    giftsEl.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2900);
  }

  /* =====================================================================
     1. WebGL 管道
        pass1 卡通化（分层 + 饱和度 + 描边存入 alpha）
        pass2 亮部提取 → 两次高斯 → bloom
        pass3 合成（框内动漫 / 框外现实 + 边框辉光）
     ===================================================================== */
  var GL = (function () {
    var gl = null, ok = false;
    var W = 0, H = 0;
    var progCartoon, progBright, progBlur, progComp;
    var buf, vtex, fbBase, fbB1, fbB2;
    var u = {};

    var VS = '#version 300 es\n' +
      'layout(location=0) in vec2 aPos;\n' +
      'out vec2 vUV;\n' +
      'void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }';

    // 只放函数：uniform 由各 shader 自己声明（避免重复声明导致编译失败）
    var COVER = 'vec2 fitUV(vec2 uv){\n' +
      '  float va = uVRes.x / max(uVRes.y, 1.0);\n' +
      '  float ca = uCanvas.x / max(uCanvas.y, 1.0);\n' +
      '  vec2 s = (ca > va) ? vec2(1.0, va / ca) : vec2(ca / va, 1.0);\n' +
      '  vec2 p = (uv - 0.5) * s + 0.5;\n' +
      '  return vec2(1.0 - p.x, p.y);\n' +
      '}\n';

    var FS_CARTOON = '#version 300 es\n' +
      'precision highp float;\n' +
      'in vec2 vUV;\n' +
      'out vec4 outColor;\n' +
      'uniform sampler2D uVideo;\n' +
      'uniform vec2 uVRes;\n' +
      'uniform vec2 uCanvas;\n' +
      'uniform vec2 uTexel;\n' +
      'uniform float uHasVideo;\n' +
      COVER +
      'float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }\n' +
      'float wgt(float l, float lc, float k){ return 1.0 / (1.0 + k * abs(l - lc)); }\n' +
      'void main(){\n' +
      '  vec2 uv = fitUV(vUV);\n' +
      '  vec3 c; float e = 0.0;\n' +
      '  if (uHasVideo > 0.5) {\n' +
      '    vec2 px = uTexel * 3.4;\n' +
      '    vec3 pa = texture(uVideo, uv + vec2(-px.x, -px.y)).rgb;\n' +
      '    vec3 pb = texture(uVideo, uv + vec2( 0.0,  -px.y)).rgb;\n' +
      '    vec3 pc = texture(uVideo, uv + vec2( px.x, -px.y)).rgb;\n' +
      '    vec3 pd = texture(uVideo, uv + vec2(-px.x,  0.0 )).rgb;\n' +
      '    vec3 pe = texture(uVideo, uv).rgb;\n' +
      '    vec3 pf = texture(uVideo, uv + vec2( px.x,  0.0 )).rgb;\n' +
      '    vec3 pg = texture(uVideo, uv + vec2(-px.x,  px.y)).rgb;\n' +
      '    vec3 ph = texture(uVideo, uv + vec2( 0.0,   px.y)).rgb;\n' +
      '    vec3 pi = texture(uVideo, uv + vec2( px.x,  px.y)).rgb;\n' +
      '    float l0 = luma(pe);\n' +
      // Sobel 墨线
      '    float lx = (luma(pc) + luma(pf) * 2.0 + luma(pi)) - (luma(pa) + luma(pd) * 2.0 + luma(pg));\n' +
      '    float ly = (luma(pg) + luma(ph) * 2.0 + luma(pi)) - (luma(pa) + luma(pb) * 2.0 + luma(pc));\n' +
      '    e = sqrt(lx * lx + ly * ly) * 2.0;\n' +
      '    e = pow(min(e, 1.6), 1.35);\n' +
      // 9 点双边：只平均亮度相近的邻居 —— 抹平皮肤/织物纹理，保留轮廓
      '    float k = 38.0;\n' +
      '    float wA = wgt(luma(pa), l0, k); float wB = wgt(luma(pb), l0, k);\n' +
      '    float wC = wgt(luma(pc), l0, k); float wD = wgt(luma(pd), l0, k);\n' +
      '    float wF = wgt(luma(pf), l0, k); float wG = wgt(luma(pg), l0, k);\n' +
      '    float wH = wgt(luma(ph), l0, k); float wI = wgt(luma(pi), l0, k);\n' +
      '    vec3 acc = pe * 1.9 + pa * wA + pb * wB + pc * wC + pd * wD\n' +
      '             + pf * wF + pg * wG + ph * wH + pi * wI;\n' +
      '    c = acc / (1.9 + wA + wB + wC + wD + wF + wG + wH + wI);\n' +
      '  } else {\n' +
      '    float r = length((vUV - vec2(0.5, 0.52)) * vec2(1.15, 1.0));\n' +
      '    c = mix(vec3(0.10,0.15,0.26), vec3(0.018,0.028,0.055), smoothstep(0.08, 0.78, r));\n' +
      '    c += vec3(0.16,0.34,0.60) * exp(-r * 4.2) * 0.5;\n' +
      '  }\n' +
      '  float l = luma(c);\n' +
      // 肤色检测（R 明显高于 B、亮度中等）—— 动漫里皮肤要亮、要粉，不能发橙
      '  float rb = c.r - c.b;\n' +
      '  float skin = smoothstep(0.02, 0.20, rb) * smoothstep(0.04, 0.22, l) * (1.0 - smoothstep(0.60, 0.92, l));\n' +
      // 1. 提亮暗部，让阴影不死黑
      '  c = pow(max(c, 0.0), vec3(0.82));\n' +
      '  float l2 = luma(c);\n' +
      // 2. 亮度 S 曲线（只缩放亮度，保色相）
      '  float ls = smoothstep(0.0, 0.90, l2);\n' +
      '  c *= mix(1.0, ls / max(l2, 0.001), 0.30);\n' +
      '  l2 = luma(c);\n' +
      // 3. 饱和度：中间调增强，肤色除外
      '  float satK = 1.0 + 0.42 * smoothstep(0.10, 0.38, l2) * (1.0 - smoothstep(0.68, 0.98, l2));\n' +
      '  satK = mix(satK, 1.02, skin * 0.85);\n' +
      '  c = mix(vec3(l2), c, satK);\n' +
      // 4. 高光软压缩
      '  c = c - 0.28 * c * c * c;\n' +
      // 5. 肤色重绘：按亮度重构浅粉肤色，避免"给棕色加亮"变成橙黄
      '  vec3 skinCol = mix(c, vec3(l2 * 1.09, l2 * 0.975, l2 * 0.965) + vec3(0.085, 0.045, 0.050), 0.62);\n' +
      '  c = mix(c, skinCol, skin * 0.80);\n' +
      // 6. 暗部填靛蓝 —— 动画阴影的标志
      '  l2 = luma(c);\n' +
      '  float shadow = 1.0 - smoothstep(0.0, 0.50, l2);\n' +
      '  c += vec3(0.048, 0.062, 0.155) * shadow * shadow;\n' +
      // 7. 亮度分层（平涂感，只动亮度不动色相，不会串色）
      '  l2 = luma(c);\n' +
      '  float b = 6.0;\n' +
      '  float lq = floor(l2 * b + 0.5) / b;\n' +
      '  c *= mix(1.0, lq / max(l2, 0.001), 0.38);\n' +
      // 8. 高光偏暖白
      '  l2 = luma(c);\n' +
      '  c = mix(c, vec3(1.0, 0.985, 0.94), smoothstep(0.82, 1.0, l2) * 0.24);\n' +
      '  c = c * 1.05 + 0.010;\n' +
      '  outColor = vec4(clamp(c, 0.0, 1.0), clamp(e, 0.0, 1.0));\n' +
      '}\n';

    var FS_BRIGHT = '#version 300 es\n' +
      'precision highp float;\n' +
      'in vec2 vUV;\n' +
      'out vec4 outColor;\n' +
      'uniform sampler2D uSrc;\n' +
      'void main(){\n' +
      '  vec3 c = texture(uSrc, vUV).rgb;\n' +
      '  float l = dot(c, vec3(0.299, 0.587, 0.114));\n' +
      '  float k = smoothstep(0.70, 0.99, l);\n' +
      '  outColor = vec4(c * k, 1.0);\n' +
      '}\n';

    var FS_BLUR = '#version 300 es\n' +
      'precision highp float;\n' +
      'in vec2 vUV;\n' +
      'out vec4 outColor;\n' +
      'uniform sampler2D uSrc;\n' +
      'uniform vec2 uStep;\n' +
      'void main(){\n' +
      '  vec3 s = texture(uSrc, vUV).rgb * 0.2270270;\n' +
      '  s += texture(uSrc, vUV + uStep * 1.3846154).rgb * 0.3162162;\n' +
      '  s += texture(uSrc, vUV - uStep * 1.3846154).rgb * 0.3162162;\n' +
      '  s += texture(uSrc, vUV + uStep * 3.2307692).rgb * 0.0702703;\n' +
      '  s += texture(uSrc, vUV - uStep * 3.2307692).rgb * 0.0702703;\n' +
      '  outColor = vec4(s, 1.0);\n' +
      '}\n';

    var FS_COMP = '#version 300 es\n' +
      'precision highp float;\n' +
      'in vec2 vUV;\n' +
      'out vec4 outColor;\n' +
      'uniform sampler2D uVideo;\n' +
      'uniform sampler2D uBase;\n' +
      'uniform sampler2D uBloom;\n' +
      'uniform vec2 uVRes;\n' +
      'uniform vec2 uCanvas;\n' +
      'uniform vec4 uRect;\n' +
      'uniform float uRectA;\n' +
      'uniform float uHasVideo;\n' +
      COVER +
      'float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }\n' +
      'void main(){\n' +
      '  vec4 base = texture(uBase, vUV);\n' +
      '  vec3 col = base.rgb;\n' +
      '  col += texture(uBloom, vUV).rgb * 0.95;\n' +
      '  float edge = base.a;\n' +
      // 皮肤上不画墨线：不然脸上的光影过渡会变成一条条黑河
      '  vec3 rv = texture(uVideo, fitUV(vUV)).rgb;\n' +
      '  float rl = luma(rv);\n' +
      '  float skinM = smoothstep(0.01, 0.11, rv.r - rv.b) * smoothstep(0.03, 0.16, rl) * (1.0 - smoothstep(0.62, 0.94, rl));\n' +
      '  if (uHasVideo < 0.5) skinM = 0.0;\n' +
      '  float line = smoothstep(0.34, 0.82, edge) * (1.0 - skinM * 0.95);\n' +
      '  col = mix(col, vec3(0.038, 0.032, 0.085), line * 0.74);\n' +
      '  float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);\n' +
      '  col += (n - 0.5) * 0.018;\n' +
      '  vec3 real = texture(uVideo, fitUV(vUV)).rgb;\n' +
      '  if (uHasVideo < 0.5) real = col * 0.62;\n' +
      '  real = mix(vec3(luma(real)), real, 0.70) * 0.74;\n' +
      '  real = mix(real, real * vec3(0.88, 0.94, 1.14), 0.60);\n' +
      '  vec2 lo = uRect.xy; vec2 hi = uRect.zw;\n' +
      '  float mx = smoothstep(lo.x - 0.007, lo.x + 0.007, vUV.x) * (1.0 - smoothstep(hi.x - 0.007, hi.x + 0.007, vUV.x));\n' +
      '  float my = smoothstep(lo.y - 0.007, lo.y + 0.007, vUV.y) * (1.0 - smoothstep(hi.y - 0.007, hi.y + 0.007, vUV.y));\n' +
      '  float m = mx * my * uRectA;\n' +
      '  vec3 fin = mix(real, col, m);\n' +
      '  float dEdge = min(min(abs(vUV.x - lo.x), abs(vUV.x - hi.x)), min(abs(vUV.y - lo.y), abs(vUV.y - hi.y)));\n' +
      '  float inside = step(lo.x - 0.03, vUV.x) * step(vUV.x, hi.x + 0.03) * step(lo.y - 0.03, vUV.y) * step(vUV.y, hi.y + 0.03);\n' +
      '  float glow = (exp(-dEdge * 900.0) + exp(-dEdge * 240.0) * 0.22) * inside * uRectA;\n' +
      '  fin += vec3(0.45, 0.90, 1.0) * glow * 0.85;\n' +
      '  float vig = 1.0 - smoothstep(0.52, 1.28, length((vUV - 0.5) * vec2(1.28, 1.0)));\n' +
      '  fin *= mix(0.78, 1.0, vig);\n' +
      '  outColor = vec4(fin, 1.0);\n' +
      '}\n';

    function sh(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.warn('shader', gl.getShaderInfoLog(s), src);
        return null;
      }
      return s;
    }

    function prog(fs) {
      var p = gl.createProgram();
      var v = sh(gl.VERTEX_SHADER, VS);
      var f = sh(gl.FRAGMENT_SHADER, fs);
      if (!v || !f) return null;
      gl.attachShader(p, v);
      gl.attachShader(p, f);
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        console.warn('link', gl.getProgramInfoLog(p));
        return null;
      }
      return p;
    }

    function tex2d(w, h) {
      var t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }

    function makeFB(w, h) {
      w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.floor(h));
      var t = tex2d(w, h);
      var f = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return { t: t, f: f, w: w, h: h };
    }

    function init() {
      gl = glCvs.getContext('webgl2', {
        alpha: false, antialias: false, depth: false, stencil: false,
        premultipliedAlpha: false, preserveDrawingBuffer: false,
        powerPreference: 'high-performance'
      });
      if (!gl) return false;

      progCartoon = prog(FS_CARTOON);
      progBright = prog(FS_BRIGHT);
      progBlur = prog(FS_BLUR);
      progComp = prog(FS_COMP);
      if (!progCartoon || !progBright || !progBlur || !progComp) return false;

      buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      vtex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, vtex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
        new Uint8Array([8, 12, 22, 255]));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

      ok = true;
      return true;
    }

    function resize() {
      if (!ok) return;
      var w = Math.floor(window.innerWidth * DPR);
      var h = Math.floor(window.innerHeight * DPR);
      if (w === W && h === H && fbBase) return;
      W = w; H = h;
      glCvs.width = W; glCvs.height = H;
      if (fbBase) { gl.deleteTexture(fbBase.t); gl.deleteFramebuffer(fbBase.f); }
      if (fbB1) { gl.deleteTexture(fbB1.t); gl.deleteFramebuffer(fbB1.f); }
      if (fbB2) { gl.deleteTexture(fbB2.t); gl.deleteFramebuffer(fbB2.f); }
      fbBase = makeFB(W * 0.75, H * 0.75);
      var bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
      fbB1 = makeFB(bw, bh);
      fbB2 = makeFB(bw, bh);
      gl.viewport(0, 0, W, H);
    }

    function bindTex(unit, texture, program, name) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(gl.getUniformLocation(program, name), unit);
    }

    function draw() {
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function render(frameRect, rectA) {
      if (!ok) return;

      var src = state.useAlt ? state.alt : video;
      var vw = state.srcW, vh = state.srcH;
      if (state.hasVideo && src) {
        try {
          gl.bindTexture(gl.TEXTURE_2D, vtex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
        } catch (e) { /* 源尚未可读 */ }
      }

      // pass1
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbBase.f);
      gl.viewport(0, 0, fbBase.w, fbBase.h);
      gl.useProgram(progCartoon);
      bindTex(0, vtex, progCartoon, 'uVideo');
      gl.uniform1f(gl.getUniformLocation(progCartoon, 'uHasVideo'), state.hasVideo ? 1 : 0);
      gl.uniform2f(gl.getUniformLocation(progCartoon, 'uVRes'), vw, vh);
      gl.uniform2f(gl.getUniformLocation(progCartoon, 'uCanvas'), W, H);
      gl.uniform2f(gl.getUniformLocation(progCartoon, 'uTexel'), 1 / vw, 1 / vh);
      draw();

      // pass2a 亮部
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbB1.f);
      gl.viewport(0, 0, fbB1.w, fbB1.h);
      gl.useProgram(progBright);
      bindTex(0, fbBase.t, progBright, 'uSrc');
      draw();

      // pass2b 横向模糊
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbB2.f);
      gl.viewport(0, 0, fbB2.w, fbB2.h);
      gl.useProgram(progBlur);
      bindTex(0, fbB1.t, progBlur, 'uSrc');
      gl.uniform2f(gl.getUniformLocation(progBlur, 'uStep'), 1 / fbB2.w, 0);
      draw();

      // pass2c 纵向模糊
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbB1.f);
      gl.viewport(0, 0, fbB1.w, fbB1.h);
      bindTex(0, fbB2.t, progBlur, 'uSrc');
      gl.uniform2f(gl.getUniformLocation(progBlur, 'uStep'), 0, 1 / fbB1.h);
      draw();

      // pass3 合成
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.useProgram(progComp);
      bindTex(0, fbBase.t, progComp, 'uBase');
      bindTex(1, fbB1.t, progComp, 'uBloom');
      bindTex(2, vtex, progComp, 'uVideo');
      gl.uniform1f(gl.getUniformLocation(progComp, 'uHasVideo'), state.hasVideo ? 1 : 0);
      gl.uniform2f(gl.getUniformLocation(progComp, 'uVRes'), vw, vh);
      gl.uniform2f(gl.getUniformLocation(progComp, 'uCanvas'), W, H);
      gl.uniform4f(gl.getUniformLocation(progComp, 'uRect'),
        frameRect.x0, frameRect.y0, frameRect.x1, frameRect.y1);
      gl.uniform1f(gl.getUniformLocation(progComp, 'uRectA'), rectA);
      draw();
    }

    return {
      init: init,
      resize: resize,
      render: render,
      isOK: function () { return ok; }
    };
  })();

  /* =====================================================================
     2. 2D 特效层
     ===================================================================== */
  var FX = (function () {
    var cvs = fxCvs;
    var ctx = cvs.getContext('2d');
    var W = 0, H = 0, SC = 1;
    var mode = 'none';
    var t = 0;

    var rainL = [];
    var splashes = [];
    var beads = [];
    var petals = [];
    var flies = [];
    var sparks = [];
    var glowSprite = null;
    var petalSprites = [];

    function makeSprite() {
      var c = document.createElement('canvas');
      c.width = c.height = 96;
      var g = c.getContext('2d');
      var rg = g.createRadialGradient(48, 48, 0, 48, 48, 48);
      rg.addColorStop(0, 'rgba(255,255,255,1)');
      rg.addColorStop(0.18, 'rgba(214,255,236,0.88)');
      rg.addColorStop(0.45, 'rgba(140,255,206,0.30)');
      rg.addColorStop(1, 'rgba(90,255,190,0)');
      g.fillStyle = rg;
      g.fillRect(0, 0, 96, 96);
      glowSprite = c;
    }

    function resize(w, h) {
      W = w; H = h;
      SC = H / 900;
      cvs.width = w; cvs.height = h;
      if (mode === 'rain') buildRain();
      if (mode === 'sakura') buildPetals();
      if (mode === 'firefly') buildFlies();
    }

    /* ---------- 雨 ---------- */
    function buildRain() {
      rainL = [];
      var dens = clamp((W * H) / (1400 * 900), 0.45, 1.7);
      var spec = [
        { n: 320, sp: [700, 1080], len: [14, 30], w: 0.9, a: 0.16, pen: 0.16 },
        { n: 200, sp: [1080, 1560], len: [28, 56], w: 1.4, a: 0.26, pen: 0.16 },
        { n: 80, sp: [1620, 2320], len: [54, 112], w: 2.1, a: 0.38, pen: 0.16 }
      ];
      for (var s = 0; s < spec.length; s++) {
        var layer = { w: spec[s].w, a: spec[s].a, pen: spec[s].pen, arr: [] };
        var n = Math.max(6, Math.round(spec[s].n * dens));
        for (var i = 0; i < n; i++) {
          layer.arr.push({
            x: rand(-W * 0.25, W * 1.05),
            y: rand(-H, H),
            sp: rand(spec[s].sp[0], spec[s].sp[1]) * SC,
            len: rand(spec[s].len[0], spec[s].len[1]) * SC
          });
        }
        rainL.push(layer);
      }

      beads = [];
      var nb = Math.round(18 * clamp(W / 1400, 0.6, 1.4));
      for (var b = 0; b < nb; b++) {
        beads.push({
          x: rand(0, W), y: rand(-H * 0.2, H),
          r: rand(1.7, 5.4) * SC,
          v: rand(7, 26) * SC,
          wob: rand(0, 6.28)
        });
      }
      splashes.length = 0;
    }

    function addSplash(x, y) {
      if (splashes.length > 160) return;
      splashes.push({ x: x, y: y, t: 0, life: rand(0.22, 0.42), r: rand(2.2, 6) * SC });
    }

    function drawRain(dt) {
      var g = ctx.createLinearGradient(0, 0, W * 0.15, H);
      g.addColorStop(0, 'rgba(24,46,80,0.40)');
      g.addColorStop(0.55, 'rgba(14,28,52,0.22)');
      g.addColorStop(1, 'rgba(6,12,24,0.14)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.lineCap = 'round';
      for (var li = 0; li < rainL.length; li++) {
        var L = rainL[li];
        ctx.strokeStyle = 'rgba(196,224,255,' + L.a + ')';
        ctx.lineWidth = L.w * SC;
        ctx.beginPath();
        for (var i = 0; i < L.arr.length; i++) {
          var d = L.arr[i];
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - d.len * L.pen, d.y - d.len);
        }
        ctx.stroke();
      }

      for (var s = splashes.length - 1; s >= 0; s--) {
        var sp = splashes[s];
        sp.t += dt;
        if (sp.t > sp.life) { splashes.splice(s, 1); continue; }
        var k = sp.t / sp.life;
        ctx.strokeStyle = 'rgba(210,234,255,' + (0.42 * (1 - k)) + ')';
        ctx.lineWidth = 1.1 * SC;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.r * (0.4 + k * 2.6), Math.PI * 1.12, Math.PI * 1.88);
        ctx.stroke();
      }

      for (var bi = 0; bi < beads.length; bi++) {
        var bd = beads[bi];
        bd.y += bd.v * dt;
        bd.wob += dt * 1.4;
        bd.x += Math.sin(bd.wob) * 6 * SC * dt;
        if (bd.y - bd.r > H + 20) {
          bd.y = -rand(10, 120) * SC;
          bd.x = rand(0, W);
          bd.v = rand(4, 15) * SC;
        }
        var r = bd.r;
        ctx.save();
        ctx.translate(bd.x, bd.y);
        // 下滑拖尾
        var tg = ctx.createLinearGradient(0, -r * 5.4, 0, 0);
        tg.addColorStop(0, 'rgba(200,226,255,0)');
        tg.addColorStop(1, 'rgba(206,230,255,0.17)');
        ctx.fillStyle = tg;
        ctx.fillRect(-r * 0.30, -r * 5.4, r * 0.60, r * 5.4);
        // 水滴本体：暗芯 + 亮环（透镜感）
        var rg = ctx.createRadialGradient(0, 0, r * 0.18, 0, 0, r);
        rg.addColorStop(0, 'rgba(12,28,52,0.26)');
        rg.addColorStop(0.64, 'rgba(26,52,88,0.26)');
        rg.addColorStop(0.93, 'rgba(196,226,255,0.40)');
        rg.addColorStop(1, 'rgba(228,245,255,0.62)');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.92, r * 1.08, 0, 0, 6.284);
        ctx.fill();
        // 主高光
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.30, -r * 0.38, r * 0.19, r * 0.27, -0.5, 0, 6.284);
        ctx.fill();
        // 底部反光
        ctx.fillStyle = 'rgba(190,225,255,0.28)';
        ctx.beginPath();
        ctx.ellipse(r * 0.18, r * 0.52, r * 0.26, r * 0.15, 0, 0, 6.284);
        ctx.fill();
        ctx.restore();
      }

      var fog = ctx.createLinearGradient(0, H * 0.62, 0, H);
      fog.addColorStop(0, 'rgba(120,155,200,0)');
      fog.addColorStop(1, 'rgba(130,165,210,0.16)');
      ctx.fillStyle = fog;
      ctx.fillRect(0, H * 0.62, W, H * 0.38);
    }

    function updateRain(dt) {
      for (var li = 0; li < rainL.length; li++) {
        var L = rainL[li];
        for (var i = 0; i < L.arr.length; i++) {
          var d = L.arr[i];
          d.y += d.sp * dt;
          d.x -= d.sp * L.pen * dt;
          if (d.y > H + 12) {
            if (Math.random() < 0.42) addSplash(d.x + d.len * L.pen, H - Math.random() * H * 0.05);
            d.y = -d.len - rand(0, H * 0.7);
            d.x = rand(-W * 0.2, W * 1.1);
            d.sp = d.sp;
          }
          if (d.x < -W * 0.3) d.x += W * 1.35;
        }
      }
    }

    /* ---------- 樱花 ---------- */
    function petalPath(g, s) {
      g.beginPath();
      g.moveTo(0, s * 0.95);
      g.bezierCurveTo(s * 0.64, s * 0.44, s * 0.80, -s * 0.22, s * 0.27, -s * 0.95);
      g.quadraticCurveTo(0, -s * 0.66, -s * 0.27, -s * 0.95);
      g.bezierCurveTo(-s * 0.80, -s * 0.22, -s * 0.64, s * 0.44, 0, s * 0.95);
      g.closePath();
    }

    // 预渲染花瓣贴图：渐变 + 高光 + 中脉，比逐帧画路径便宜也更细腻
    function makePetalSprite(hue, light) {
      var c = document.createElement('canvas');
      c.width = 128; c.height = 160;
      var g = c.getContext('2d');
      g.translate(64, 80);
      var s = 70;
      petalPath(g, s);
      var grd = g.createLinearGradient(0, -s, 0, s);
      grd.addColorStop(0, 'hsla(' + hue + ',96%,' + (light + 9) + '%,1)');
      grd.addColorStop(0.52, 'hsla(' + hue + ',92%,' + light + '%,1)');
      grd.addColorStop(1, 'hsla(' + (hue - 9) + ',86%,' + (light - 11) + '%,1)');
      g.fillStyle = grd;
      g.fill();

      g.save();
      petalPath(g, s);
      g.clip();
      var rg = g.createRadialGradient(0, -s * 0.38, 0, 0, -s * 0.30, s * 0.95);
      rg.addColorStop(0, 'rgba(255,255,255,0.55)');
      rg.addColorStop(0.55, 'rgba(255,255,255,0.10)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg;
      g.fillRect(-s, -s, s * 2, s * 2);
      g.strokeStyle = 'rgba(255,228,240,0.34)';
      g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(0, s * 0.78); g.lineTo(0, -s * 0.50); g.stroke();
      g.restore();
      return c;
    }

    function buildPetals() {
      petals = [];
      var dens = clamp((W * H) / (1400 * 900), 0.42, 1.5);
      var n = Math.round(230 * dens);
      for (var i = 0; i < n; i++) {
        var deep = Math.pow(Math.random(), 0.72);
        petals.push({
          x: rand(-W * 0.1, W * 1.1),
          y: rand(-H, H),
          s: (4.6 + deep * 17) * SC,
          rot: rand(0, 6.28),
          rotSp: rand(-1.9, 1.9),
          vx: rand(-24, 54) * SC,
          vy: (24 + deep * 78) * SC,
          ph: rand(0, 6.28),
          phSp: rand(0.45, 1.6),
          a: 0.30 + deep * 0.55,
          variant: (Math.random() * 4) | 0,
          blur: deep > 0.86 ? 4.5 : (deep > 0.70 ? 1.6 : 0)
        });
      }
    }

    function updatePetals(dt) {
      for (var i = 0; i < petals.length; i++) {
        var p = petals[i];
        p.ph += p.phSp * dt;
        p.x += (p.vx + Math.sin(p.ph) * 42 * SC) * dt;
        p.y += p.vy * dt;
        p.rot += p.rotSp * dt;
        if (p.y > H + 40) { p.y = -40; p.x = rand(-W * 0.15, W * 1.15); }
        if (p.x > W + 60) p.x = -50;
        if (p.x < -60) p.x = W + 50;
      }
    }

    function drawPetals() {
      var warm = ctx.createRadialGradient(W * 0.5, H * 0.25, 0, W * 0.5, H * 0.3, Math.max(W, H) * 0.8);
      warm.addColorStop(0, 'rgba(255,196,224,0.16)');
      warm.addColorStop(0.5, 'rgba(255,168,206,0.07)');
      warm.addColorStop(1, 'rgba(120,80,160,0)');
      ctx.fillStyle = warm;
      ctx.fillRect(0, 0, W, H);

      for (var i = 0; i < petals.length; i++) {
        var p = petals[i];
        var flip = Math.cos(p.ph * 0.85);
        ctx.save();
        if (p.blur) ctx.filter = 'blur(' + (p.blur * SC).toFixed(2) + 'px)';
        ctx.globalAlpha = p.a;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.max(0.14, Math.abs(flip)));
        ctx.drawImage(petalSprites[p.variant], -p.s, -p.s * 1.25, p.s * 2, p.s * 2.5);
        ctx.restore();
      }
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
    }

    /* ---------- 萤火 ---------- */
    function buildFlies() {
      flies = [];
      var dens = clamp((W * H) / (1400 * 900), 0.4, 1.5);
      var n = Math.round(52 * dens);
      for (var i = 0; i < n; i++) {
        flies.push({
          x: rand(0, W), y: rand(0, H),
          s: rand(7, 30) * SC,
          ph: rand(0, 6.28),
          sp: rand(0.35, 1.3),
          vx: rand(-14, 14) * SC,
          vy: rand(-12, 12) * SC,
          hue: Math.random() < 0.35 ? 168 : 96
        });
      }
    }

    function updateFlies(dt) {
      for (var i = 0; i < flies.length; i++) {
        var f = flies[i];
        f.ph += f.sp * dt;
        f.x += (f.vx + Math.sin(f.ph * 0.8) * 16 * SC) * dt;
        f.y += (f.vy + Math.cos(f.ph * 1.1) * 12 * SC) * dt;
        if (f.x < -60) f.x = W + 40; if (f.x > W + 60) f.x = -40;
        if (f.y < -60) f.y = H + 40; if (f.y > H + 60) f.y = -40;
      }
    }

    function drawFlies() {
      var dark = ctx.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, Math.max(W, H) * 0.75);
      dark.addColorStop(0, 'rgba(6,22,20,0.34)');
      dark.addColorStop(0.6, 'rgba(4,14,20,0.52)');
      dark.addColorStop(1, 'rgba(2,6,12,0.68)');
      ctx.fillStyle = dark;
      ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < flies.length; i++) {
        var f = flies[i];
        var pulse = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(f.ph * 1.9), 2.2);
        var sz = f.s * (0.75 + pulse * 0.5);
        ctx.globalAlpha = pulse * 0.85;
        if (glowSprite) ctx.drawImage(glowSprite, f.x - sz, f.y - sz, sz * 2, sz * 2);
        ctx.globalAlpha = pulse * 0.55;
        ctx.fillStyle = f.hue === 168 ? 'rgba(210,255,245,0.9)' : 'rgba(238,255,200,0.9)';
        ctx.beginPath();
        ctx.arc(f.x, f.y, Math.max(0.7, sz * 0.055), 0, 6.284);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    /* ---------- 通用：光点 / 冲击波 ---------- */
    function burst(x, y, n) {
      sparks.push({ type: 'ring', x: x, y: y, t: 0, life: 0.9, r: 10 });
      for (var i = 0; i < (n || 46); i++) {
        var a = Math.random() * 6.284;
        var sp = rand(80, 620) * SC;
        sparks.push({
          type: 'dot', x: x, y: y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          t: 0, life: rand(0.45, 1.1),
          s: rand(1.4, 4.4) * SC,
          hue: Math.random() < 0.5 ? 190 : 330
        });
      }
      if (sparks.length > 400) sparks.splice(0, sparks.length - 400);
      state.flash = Math.max(state.flash, 0.72);
    }

    function updateSparks(dt) {
      for (var i = sparks.length - 1; i >= 0; i--) {
        var s = sparks[i];
        s.t += dt;
        if (s.t > s.life) { sparks.splice(i, 1); continue; }
        if (s.type === 'dot') {
          s.x += s.vx * dt; s.y += s.vy * dt;
          s.vx *= 0.945; s.vy *= 0.945;
          s.vy += 40 * SC * dt;
        } else {
          s.r += 900 * SC * dt;
        }
      }
    }

    function drawSparks() {
      if (!sparks.length) return;
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < sparks.length; i++) {
        var s = sparks[i];
        var k = 1 - s.t / s.life;
        if (s.type === 'ring') {
          ctx.strokeStyle = 'rgba(200,240,255,' + (k * 0.55) + ')';
          ctx.lineWidth = (1 + k * 3.2) * SC;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, 6.284);
          ctx.stroke();
        } else {
          ctx.globalAlpha = k;
          ctx.fillStyle = s.hue === 190 ? 'rgba(190,240,255,1)' : 'rgba(255,200,225,1)';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.s * k, 0, 6.284);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    /* ---------- 取景框装饰 ---------- */
    function drawFrame(fr, alpha) {
      if (alpha < 0.02) return;
      var x0 = fr.x0 * W, x1 = fr.x1 * W;
      var y0 = (1 - fr.y1) * H, y1 = (1 - fr.y0) * H;
      var w = x1 - x0, h = y1 - y0;
      if (w < 8 || h < 8) return;

      ctx.save();
      ctx.globalAlpha = alpha;

      var pulse = 0.55 + 0.45 * Math.sin(t * 2.2);
      ctx.strokeStyle = 'rgba(150,235,255,' + (0.30 + pulse * 0.25) + ')';
      ctx.lineWidth = 1 * SC;
      ctx.setLineDash([6 * SC, 7 * SC]);
      ctx.lineDashOffset = -t * 26 * SC;
      ctx.strokeRect(x0, y0, w, h);
      ctx.setLineDash([]);

      var arm = Math.min(w, h) * 0.16;
      arm = Math.min(arm, 42 * SC);
      ctx.strokeStyle = 'rgba(190,245,255,0.92)';
      ctx.lineWidth = 2.2 * SC;
      ctx.shadowColor = 'rgba(120,230,255,0.9)';
      ctx.shadowBlur = 12 * SC;
      var corners = [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]];
      ctx.beginPath();
      for (var i = 0; i < corners.length; i++) {
        var c = corners[i];
        ctx.moveTo(c[0] + c[2] * arm, c[1]);
        ctx.lineTo(c[0], c[1]);
        ctx.lineTo(c[0], c[1] + c[3] * arm);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.font = '600 ' + (9 * SC).toFixed(1) + 'px -apple-system,"PingFang SC",sans-serif';
      ctx.fillStyle = 'rgba(180,240,255,0.86)';
      ctx.textBaseline = 'bottom';
      ctx.fillText('ANIME', x0 + 2 * SC, y0 - 5 * SC);
      ctx.restore();
    }

    /* ---------- 生命周期 ---------- */
    function setMode(m) {
      if (mode === m) return;
      mode = m;
      splashes.length = 0;
      if (m === 'rain') buildRain();
      if (m === 'sakura') buildPetals();
      if (m === 'firefly') buildFlies();
    }

    function update(dt) {
      t += dt;
      if (mode === 'rain') { updateRain(dt); }
      else if (mode === 'sakura') { updatePetals(dt); }
      else if (mode === 'firefly') { updateFlies(dt); }
      updateSparks(dt);
      if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.6);
    }

    function draw(frameRect, frameA) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);

      if (mode === 'rain') drawRain(0);
      else if (mode === 'sakura') drawPetals();
      else if (mode === 'firefly') drawFlies();

      drawSparks();
      drawFrame(frameRect, frameA);

      if (mode === 'rain') {
        var bolt = Math.random() < 0.0016 ? 0.55 : 0;
        if (bolt > state.flash) state.flash = bolt;
      }
      if (state.flash > 0.003) {
        ctx.fillStyle = 'rgba(214,234,255,' + (state.flash * 0.5) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    makeSprite();
    petalSprites.push(makePetalSprite(342, 76));
    petalSprites.push(makePetalSprite(350, 81));
    petalSprites.push(makePetalSprite(334, 71));
    petalSprites.push(makePetalSprite(356, 85));
    return { resize: resize, setMode: setMode, update: update, draw: draw, burst: burst,
      getMode: function () { return mode; }, getTime: function () { return t; } };
  })();

  /* =====================================================================
     3. 手势
     ===================================================================== */
  var G = (function () {
    var MP_VER = '0.4.1675469240';
    var BASES = [
      'https://registry.npmmirror.com/@mediapipe/hands/' + MP_VER + '/files/',
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@' + MP_VER + '/',
      'https://fastly.jsdelivr.net/npm/@mediapipe/hands@' + MP_VER + '/',
      'https://unpkg.com/@mediapipe/hands@' + MP_VER + '/'
    ];
    var hands = null, engine = 'idle', running = false, busy = false;
    var hist = [], stable = -99, lastSeen = 0;
    var pctx = null;
    var scriptCache = {};

    var CONN = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
    ];
    var CHAINS = [[5, 6, 8], [9, 10, 12], [13, 14, 16], [17, 18, 20]];

    function d2(a, b) {
      var dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function loadScript(src) {
      if (scriptCache[src]) return scriptCache[src];
      scriptCache[src] = new Promise(function (res, rej) {
        var s = document.createElement('script');
        s.src = src; s.async = true;
        s.onload = function () { res(true); };
        s.onerror = function () { rej(new Error('fail')); };
        document.head.appendChild(s);
      });
      return scriptCache[src];
    }

    async function pickBase() {
      var prom = BASES.map(function (b) {
        return loadScript(b + 'hands.js').then(function () { return b; }).catch(function () { return null; });
      });
      var res = await Promise.all(prom);
      for (var i = 0; i < res.length; i++) if (res[i]) return res[i];
      return null;
    }

    function countFingers(lm) {
      var wrist = lm[0], c = 0;
      for (var f = 0; f < CHAINS.length; f++) {
        var pip = lm[CHAINS[f][1]], tip = lm[CHAINS[f][2]];
        if (d2(tip, wrist) / Math.max(d2(pip, wrist), 1e-4) > 1.2) c++;
      }
      return c;
    }

    // 拇指与食指拉开 → 取景框（门槛要够高，否则比"1"时拇指自然张开会被误判）
    function frameOf(lm) {
      var palm = Math.max(d2(lm[0], lm[9]), 1e-4);
      var th = lm[4], ix = lm[8];
      var open = d2(th, ix) / palm;
      if (open < 0.88) return null;
      var ax = 1 - th.x, ay = 1 - th.y;
      var bx = 1 - ix.x, by = 1 - ix.y;
      return {
        x0: Math.min(ax, bx), y0: Math.min(ay, by),
        x1: Math.max(ax, bx), y1: Math.max(ay, by),
        open: open
      };
    }

    function onGesture(c) {
      if (c === 1) applyMode('rain');
      else if (c === 2) applyMode('sakura');
      else if (c === 3) applyMode('firefly');
      else if (c === 0) applyMode('none');
      else if (c >= 4) {
        FX.burst(window.innerWidth * 0.5 * DPR, window.innerHeight * 0.52 * DPR, 60);
        setHint('爆散 · 世界碎了', 2200);
        gift('✦', '全屏爆散', 'x1');
      }
    }

    function onResults(res) {
      var all = (res && res.multiHandLandmarks) ? res.multiHandLandmarks : [];
      drawPreview(all);
      var now = performance.now();

      if (!all.length) {
        G.lost = true;
        hist.length = 0;
        stable = -99;
        state.targetA = 0;
        if (state.gesture !== 'none' && now - G.lastActive > 900) {
          state.gesture = '';
        }
        setRow(rowGes, 'off', '画面里没有手');
        return;
      }

      lastSeen = now;
      G.lastActive = now;
      if (G.lost) { G.lost = false; }

      // 取景框（任一手）
      var best = null;
      for (var i = 0; i < all.length; i++) {
        var f = frameOf(all[i]);
        if (!f) continue;
        if (!best) best = f;
        else {
          best = {
            x0: Math.min(best.x0, f.x0), y0: Math.min(best.y0, f.y0),
            x1: Math.max(best.x1, f.x1), y1: Math.max(best.y1, f.y1)
          };
        }
      }

      if (best && (best.x1 - best.x0) > 0.09 && (best.y1 - best.y0) > 0.09) {
        state.tgt.x0 = best.x0; state.tgt.y0 = best.y0;
        state.tgt.x1 = best.x1; state.tgt.y1 = best.y1;
        state.targetA = 1;
        hist.length = 0;
        stable = -99;
        state.gesture = 'frame';
        setRow(rowGes, 'act', '取景中');
        return;
      }

      state.targetA = 0;

      var c = countFingers(all[0]);
      hist.push(c);
      if (hist.length > 6) hist.shift();
      if (hist.length === 6) {
        var same = true;
        for (var k = 1; k < 6; k++) if (hist[k] !== hist[0]) { same = false; break; }
        if (same && stable !== c) {
          stable = c;
          onGesture(c);
        }
      }

      var label = c === 0 ? '握拳' : c + ' 指';
      setRow(rowGes, 'ok', state.gesture === 'frame' ? '取景中' : label);
    }

    function drawPreview(all) {
      var w = prevCvs.width, h = prevCvs.height;
      if (!pctx) pctx = prevCvs.getContext('2d');
      pctx.clearRect(0, 0, w, h);

      var src = state.useAlt ? state.alt : video;
      if (!state.hasVideo || !src) {
        prevOff.style.display = 'grid';
        return;
      }
      prevOff.style.display = 'none';

      var vw = state.srcW || 640, vh = state.srcH || 480;
      var s = Math.max(w / vw, h / vh);
      var dw = vw * s, dh = vh * s;
      var dx = (w - dw) / 2, dy = (h - dh) / 2;

      pctx.save();
      pctx.translate(w, 0);
      pctx.scale(-1, 1);
      pctx.globalAlpha = 0.92;
      pctx.drawImage(src, dx, dy, dw, dh);
      pctx.globalAlpha = 1;

      for (var i = 0; i < all.length; i++) {
        var lm = all[i];
        pctx.strokeStyle = 'rgba(140,240,255,0.85)';
        pctx.lineWidth = 1.4;
        pctx.beginPath();
        for (var c = 0; c < CONN.length; c++) {
          var a = lm[CONN[c][0]], b = lm[CONN[c][1]];
          pctx.moveTo(dx + a.x * dw, dy + a.y * dh);
          pctx.lineTo(dx + b.x * dw, dy + b.y * dh);
        }
        pctx.stroke();
        pctx.fillStyle = 'rgba(255,255,255,0.92)';
        for (var j = 0; j < lm.length; j++) {
          var r = (j === 4 || j === 8) ? 2.4 : 1.3;
          pctx.beginPath();
          pctx.arc(dx + lm[j].x * dw, dy + lm[j].y * dh, r, 0, 6.284);
          pctx.fill();
        }
      }
      pctx.restore();
    }

    async function startEngine() {
      if (engine === 'ready') { kick(); return true; }
      if (engine === 'loading') return false;
      engine = 'loading';
      setRow(rowEng, 'wait', '加载中');

      var base = await pickBase();
      if (!base) {
        engine = 'idle';
        setRow(rowEng, 'bad', '连不上');
        toast('手势引擎加载失败（网络受限）。可以用底部按钮体验特效。');
        return false;
      }

      try {
        if (typeof window.Hands === 'undefined') await loadScript(base + 'hands.js');
        if (typeof window.Hands === 'undefined') throw new Error('no Hands');

        hands = new window.Hands({ locateFile: function (f) { return base + f; } });
        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 0,
          minDetectionConfidence: 0.58,
          minTrackingConfidence: 0.55
        });
        hands.onResults(onResults);

        engine = 'ready';
        setRow(rowEng, 'ok', '运行中');
        kick();
        return true;
      } catch (e) {
        console.warn(e);
        engine = 'idle';
        setRow(rowEng, 'bad', '初始化失败');
        toast('手势引擎初始化失败。可以用底部按钮体验特效。');
        return false;
      }
    }

    function kick() {
      if (running) return;
      running = true;
      (function loop() {
        if (!running) return;
        if (!busy && state.hasVideo && video.readyState >= 2) {
          busy = true;
          var t0 = performance.now();
          hands.send({ image: video }).catch(function () {}).then(function () {
            busy = false;
            G.latency = performance.now() - t0;
          });
        }
        requestAnimationFrame(loop);
      })();
    }

    function stop() {
      running = false;
    }

    return {
      startEngine: startEngine,
      stop: stop,
      lost: true,
      lastActive: 0,
      latency: 0
    };
  })();

  /* =====================================================================
     4. 摄像头
     ===================================================================== */
  async function enableCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('当前环境不支持摄像头（需要 https 或 localhost）。');
      setRow(rowCam, 'bad', '不支持');
      return false;
    }
    setRow(rowCam, 'wait', '请求中');
    try {
      var stream = await Promise.race([
        navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        }),
        new Promise(function (_, rej) {
          setTimeout(function () { rej(new Error('getUserMedia timeout')); }, 12000);
        })
      ]);
      video.srcObject = stream;
      // play() 在某些环境会一直挂起，不等它
      var pp = video.play();
      if (pp && typeof pp.then === 'function') {
        await Promise.race([pp.catch(function () {}), new Promise(function (r) { setTimeout(r, 2500); })]);
      }
      state.camOn = true;
      state.hasVideo = true;
      state.useAlt = false;
      state.srcW = video.videoWidth || 640;
      state.srcH = video.videoHeight || 480;
      setRow(rowCam, 'ok', '已连接');
      prevWrap.classList.add('on');
      return true;
    } catch (e) {
      var msg = '无法开启摄像头：';
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
        msg += '权限被拒绝。请点地址栏左侧的图标允许摄像头，然后刷新。';
        setRow(rowCam, 'bad', '权限被拒');
      } else if (e && e.name === 'NotFoundError') {
        msg += '没有检测到摄像头设备。';
        setRow(rowCam, 'bad', '无设备');
      } else if (e && e.name === 'NotReadableError') {
        msg += '摄像头被其它程序占用（会议 / 直播软件），关掉后再试。';
        setRow(rowCam, 'bad', '被占用');
      } else if (e && e.message === 'getUserMedia timeout') {
        msg += '请求超时。可能是浏览器还没等到你授权，或当前没有可用摄像头。';
        setRow(rowCam, 'bad', '超时');
      } else {
        msg += (e && e.message) || '未知错误';
        setRow(rowCam, 'bad', '失败');
      }
      toast(msg);
      return false;
    }
  }

  function enterStage() {
    if (introEl.classList.contains('gone')) return;
    introEl.classList.add('gone');
    setTimeout(function () { introEl.style.display = 'none'; }, 860);
    brandEl.classList.add('on');
    statEl.classList.add('on');
    barEl.classList.add('on');
  }

  /* =====================================================================
     5. 模式
     ===================================================================== */
  function applyMode(m) {
    if (state.mode === m && m !== 'none') {
      FX.burst(window.innerWidth * 0.5 * DPR, window.innerHeight * 0.52 * DPR, 34);
    }
    state.mode = m;
    FX.setMode(m);

    var btns = barEl.querySelectorAll('button[data-act]');
    for (var i = 0; i < btns.length; i++) {
      var a = btns[i].getAttribute('data-act');
      btns[i].classList.toggle('on',
        (m === 'rain' && a === '1') || (m === 'sakura' && a === '2') || (m === 'firefly' && a === '3'));
    }

    if (m === 'rain') { setHint(HINTS.rain, 4000); gift('☂', '雨夜', '特效已启用'); }
    else if (m === 'sakura') { setHint(HINTS.sakura, 4000); gift('❀', '樱吹雪', '特效已启用'); }
    else if (m === 'firefly') { setHint(HINTS.firefly, 4000); gift('✧', '萤火', '特效已启用'); }
    else { setHint(HINTS.none, 3000); }

    state.gesture = m === 'none' ? 'none' : m;
  }

  /* =====================================================================
     6. 主循环
     ===================================================================== */
  var lastT = performance.now();
  function tick(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    if (!state.useAlt && video.videoWidth) {
      state.srcW = video.videoWidth;
      state.srcH = video.videoHeight;
    }

    // 取景框平滑
    var f = state.frame, tg = state.tgt;
    var k = 1 - Math.pow(0.0015, dt);
    f.x0 = lerp(f.x0, tg.x0, k);
    f.y0 = lerp(f.y0, tg.y0, k);
    f.x1 = lerp(f.x1, tg.x1, k);
    f.y1 = lerp(f.y1, tg.y1, k);
    f.a = lerp(f.a, state.targetA, 1 - Math.pow(0.0008, dt));

    GL.render(f, f.a);
    FX.update(dt);
    FX.draw(f, f.a);

    requestAnimationFrame(tick);
  }

  /* =====================================================================
     7. 事件绑定
     ===================================================================== */
  function onResize() {
    GL.resize();
    var pw = Math.round((prevWrap.clientWidth || 168) * Math.min(DPR, 2));
    var ph = Math.round((prevWrap.clientHeight || 126) * Math.min(DPR, 2));
    prevCvs.width = pw; prevCvs.height = ph;
    FX.resize(
      glCvs.width || Math.floor(window.innerWidth * DPR),
      glCvs.height || Math.floor(window.innerHeight * DPR)
    );
  }

  $('go').addEventListener('click', async function () {
    this.textContent = '连接中…';
    this.disabled = true;
    var ok = await enableCamera();
    if (ok) {
      enterStage();
      setHint(HINTS.idle, 6000);
      G.startEngine();
    } else {
      this.textContent = '重试';
      this.disabled = false;
    }
  });

  $('demo').addEventListener('click', function () {
    enterStage();
    setRow(rowCam, 'off', '演示');
    setRow(rowEng, 'off', '演示');
    setRow(rowGes, 'off', '鼠标可拖动');
    setHint(HINTS.idle, 8000);
    state.tgt.x0 = 0.20; state.tgt.y0 = 0.20;
    state.tgt.x1 = 0.62; state.tgt.y1 = 0.70;
    state.targetA = 1;
  });

  barEl.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'cam') {
      if (!state.camOn) {
        b.textContent = '连接中…';
        enableCamera().then(function (ok) {
          if (ok) {
            enterStage();
            setHint(HINTS.idle, 6000);
            G.startEngine();
            b.textContent = '关闭';
            b.classList.add('live');
          } else {
            b.textContent = '开启摄像头';
          }
        });
      } else {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(function (t) { t.stop(); });
          video.srcObject = null;
        }
        state.camOn = false;
        state.hasVideo = false;
        prevWrap.classList.remove('on');
        setRow(rowCam, 'off', '已关闭');
        b.textContent = '开启摄像头';
        b.classList.remove('live');
      }
      return;
    }
    if (a === '0') applyMode('none');
    else applyMode(a === '1' ? 'rain' : a === '2' ? 'sakura' : 'firefly');
  });

  /* 演示模式：鼠标拖拽画框 */
  var drag = null;
  window.addEventListener('pointerdown', function (e) {
    if (introEl && !introEl.classList.contains('gone')) return;
    if (state.camOn) return;
    if (e.target.closest('#bar') || e.target.closest('#prevwrap') || e.target.closest('#stat')) return;
    drag = { x: e.clientX / window.innerWidth, y: 1 - e.clientY / window.innerHeight };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var x = e.clientX / window.innerWidth, y = 1 - e.clientY / window.innerHeight;
    state.tgt.x0 = Math.min(drag.x, x); state.tgt.x1 = Math.max(drag.x, x);
    state.tgt.y0 = Math.min(drag.y, y); state.tgt.y1 = Math.max(drag.y, y);
    state.targetA = 1;
  });
  window.addEventListener('pointerup', function () {
    if (!drag) return;
    drag = null;
    if (!state.camOn) return;
    // 摄像头模式下拖拽结束后淡出，交还给手势
    setTimeout(function () { if (!drag) state.targetA = 0; }, 120);
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === '1') applyMode('rain');
    else if (e.key === '2') applyMode('sakura');
    else if (e.key === '3') applyMode('firefly');
    else if (e.key === '0' || e.key === 'Escape') applyMode('none');
    else if (e.key === 'f' || e.key === 'F') {
      FX.burst(window.innerWidth * 0.5 * DPR, window.innerHeight * 0.5 * DPR, 60);
    }
  });

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 240); });

  /* ---- 启动 ---- */
  var glOK = GL.init();
  if (!glOK) {
    toast('浏览器不支持 WebGL2，画面将以普通模式显示。');
    glCvs.style.display = 'none';
  }
  onResize();

  // URL 调试参数：#demo / #r=0.2,0.3,0.7,0.8 / #m=rain
  (function readHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return;
    var parts = h.split('&');
    var kv = {};
    parts.forEach(function (p) {
      var i = p.indexOf('=');
      if (i < 0) kv[p] = '1'; else kv[p.slice(0, i)] = p.slice(i + 1);
    });
    if (kv.r) {
      var a = kv.r.split(',').map(parseFloat);
      if (a.length === 4 && a.every(function (v) { return !isNaN(v); })) {
        state.tgt.x0 = a[0]; state.tgt.y0 = a[1];
        state.tgt.x1 = a[2]; state.tgt.y1 = a[3];
        state.frame.x0 = a[0]; state.frame.y0 = a[1];
        state.frame.x1 = a[2]; state.frame.y1 = a[3];
        state.targetA = 1; state.frame.a = 1;
      }
    }
    if (kv.m) applyMode(kv.m);
    if (kv.img) {
      var im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = function () {
        var c = document.createElement('canvas');
        c.width = im.naturalWidth || 1280;
        c.height = im.naturalHeight || 720;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        state.alt = c;
        state.srcW = c.width;
        state.srcH = c.height;
        state.useAlt = true;
        state.hasVideo = true;
      };
      im.src = decodeURIComponent(kv.img);
    }
    if (kv.auto) {
      enableCamera().then(function (ok) {
        enterStage();
        if (ok) {
          G.startEngine();
          var cb = barEl.querySelector('button[data-act="cam"]');
          if (cb) { cb.textContent = '关闭'; cb.classList.add('live'); }
          setHint(HINTS.idle, 6000);
        }
      });
    }
    if (kv.demo) {
      enterStage();
      setRow(rowCam, 'off', '演示');
      setRow(rowEng, 'off', '演示');
      setRow(rowGes, 'off', '演示');
      setHint(HINTS.idle, 9000);
    }
  })();

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
